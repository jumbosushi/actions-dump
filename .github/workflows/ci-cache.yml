name: CI cache

on:
  workflow_dispatch:
    inputs:
      myCommit:
        description: 'Commit SHA!'
        required: true
        default: 'undefined'
        type: string

jobs:
  # Level 1 (root): builds the shared yarn cache and installs deps once.
  setup:
    name: Setup & install
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.node.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: echo check
        run: |
          set -eou pipefail
          echo "Hello world 🚀"
          echo ${{ inputs.myCommit }}

      - name: Capture commit
        id: commit
        run: echo "sha=${{ inputs.myCommit }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: v24.20.0
          cache: 'yarn'
          # Useful for caching dependencies in monorepos:
          cache-dependency-path: yarn.lock

      - name: Get node version
        id: node
        run: echo "version=$(node -v)" >> "$GITHUB_OUTPUT"

      - run: yarn install

      - name: Generate setup info
        run: echo "built-by=setup node=${{ steps.node.outputs.version }} commit=${{ inputs.myCommit }}" > setup-info.txt

      - name: Upload setup info
        uses: actions/upload-artifact@v4
        with:
          name: setup-info
          path: setup-info.txt

  # Level 2: these run in PARALLEL, but only after `setup` finishes.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download setup artifact
        uses: actions/download-artifact@v4
        with:
          name: setup-info

      - name: Use setup output
        run: |
          cat setup-info.txt
          echo "lint sees node ${{ needs.setup.outputs.node_version }}"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download setup artifact
        uses: actions/download-artifact@v4
        with:
          name: setup-info

      - name: Read setup info
        run: |
          cat setup-info.txt
          echo "test (parallel with lint) on ${{ needs.setup.outputs.node_version }}"

  # Level 3: fan-in. `build` waits on BOTH lint and test.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - run: echo "build only starts after lint AND test succeed"

      - name: Create bundle
        run: |
          mkdir -p dist
          echo "pretend-bundle-of-${{ needs.setup.outputs.commit }}" > dist/bundle.txt
          echo "test: $GITHUB_RUN_ID"
          echo "test: ${{ runner.name }}"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/

  # Level 4: nested chain. `deploy` waits on `build`.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Show bundle
        run: cat dist/bundle.txt
