name: CI cache

on:
  workflow_dispatch:
    inputs:
      myCommit:
        description: 'Commit SHA!'
        required: true
        default: 'undefined'
        type: string

jobs:
  ci:
    name: Running CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: echo check
        run: |
          set -eou pipefail
          echo "Hello world 🚀"
          echo ${{ inputs.myCommit }}

      - uses: actions/setup-node@v7
        with:
          node-version: v24.20.0
          cache: 'yarn'
          # Useful for caching dependencies in monorepos:
          cache-dependency-path: yarn.lock

      - run: yarn install

      ### - run: yarn test
